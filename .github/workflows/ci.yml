name: CI

# every branch is checked on push, so a change is verified before it reaches main;
# releases are cut only from main (release.yml)
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-22.04, python: "3.8"}    # oldest supported
          - {os: ubuntu-latest, python: "3.11"}  # what SteamOS 3.x ships
          - {os: ubuntu-latest, python: "3.13"}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # tests/test_update.py updates the last single-file release
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Lint
        run: |
          python -m pip install pyflakes
          python -m pyflakes src tools tests
          sh -n install.sh
      - name: Build
        run: python tools/build.py
      - name: Bridge file is up to date
        # temporary: deckdrop.py in main is what 0.3.23 updates from; remove with the file
        run: if [ -f deckdrop.py ]; then python tools/build.py --check deckdrop.py; fi
      - name: Unit and update tests
        run: python -m unittest discover -s tests -v
      - name: Smoke, from source
        run: python tests/smoke.py tools/dev.py
      - name: Smoke, built file
        run: python tests/smoke.py dist/deckdrop.py
