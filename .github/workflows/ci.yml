name: CI

# every branch is checked on push, so a change is verified before it reaches main;
# releases are cut only from main (release.yml)
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-22.04, python: "3.8"}    # oldest supported
          - {os: ubuntu-latest, python: "3.11"}  # what SteamOS 3.x ships
          - {os: ubuntu-latest, python: "3.13"}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0          # tests/test_update.py updates the last single-file release
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Lint
        run: |
          python -m pip install pyflakes
          python -m pyflakes src tools tests
          sh -n install.sh
      - name: Build
        run: python tools/build.py
      - name: Unit and update tests
        run: python -m unittest discover -s tests -v
        env:
          DECKDROP_SKIP_USER_DATA: "1"   # runs as its own step below
      - name: User data survives an update (required)
        # updates from each earlier release through its own "update" button and checks
        # that no setting, password, game or file of the user is lost or rewritten
        run: python -m unittest -v tests/test_user_data.py
      - name: Smoke, from source
        run: python tests/smoke.py tools/dev.py
      - name: Smoke, built file
        run: python tests/smoke.py dist/deckdrop.py
      - name: Page in a browser, every language
        # no JavaScript errors and no untranslated keys on any tab, language switch works
        if: matrix.python == '3.11'
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          python tests/ui_check.py dist/deckdrop.py
