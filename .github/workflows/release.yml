name: Release

# A release is cut when __version__ in src/deckdrop/__init__.py changes on main:
# the package is built into one deckdrop.py, tagged vX.Y.Z and published with install.sh.
# The release notes are the version's section of CHANGELOG.md, followed by GitHub's list of
# merged pull requests and a link to the full diff against the previous release.
# Installed copies update from releases/latest/download/deckdrop.py.

on:
  push:
    branches: [main]
    paths: [src/**, tools/build.py, install.sh, CHANGELOG.md]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # builds and tests with a read-only token: nothing installed here from PyPI or apt
  # can touch the release; the write token lives only in the small publish job below
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.ver.outputs.version }}
      new: ${{ steps.ver.outputs.new }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Read version
        id: ver
        run: |
          ver=$(python -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('src/deckdrop/__init__.py', encoding='utf-8').read()).group(1))")
          if ! printf '%s' "$ver" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "unexpected version: $ver"; exit 1
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$ver" >/dev/null; then
            echo "v$ver already released, nothing to do"
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and check
        if: steps.ver.outputs.new == 'true'
        run: |
          python tools/changelog.py --check
          python -m pip install pyflakes
          python -m pyflakes src tools tests
          python tools/build.py
          DECKDROP_SKIP_USER_DATA=1 python -m unittest discover -s tests
          python tests/smoke.py dist/deckdrop.py
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          python tests/ui_check.py dist/deckdrop.py

      - name: User data survives an update (required)
        if: steps.ver.outputs.new == 'true'
        run: python -m unittest -v tests/test_user_data.py

      - name: Release files
        if: steps.ver.outputs.new == 'true'
        env:
          VER: ${{ steps.ver.outputs.version }}
        run: |
          mkdir -p out
          cp dist/deckdrop.py install.sh out/
          python tools/changelog.py "$VER" > out/notes.md
          (cd out && sha256sum deckdrop.py install.sh)

      - uses: actions/upload-artifact@v4
        if: steps.ver.outputs.new == 'true'
        with:
          name: release
          path: out/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: needs.build.outputs.new == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: out

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VER: ${{ needs.build.outputs.version }}
        run: |
          cd out
          gh release create "v$VER" deckdrop.py install.sh \
            --target "$GITHUB_SHA" \
            --title "DeckDrop $VER" \
            --notes-file notes.md \
            --generate-notes
