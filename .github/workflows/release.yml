name: Release

# A release is cut when __version__ in src/deckdrop/__init__.py changes on main:
# the package is built into one deckdrop.py, tagged vX.Y.Z and published with install.sh.
# The release notes are the version's section of CHANGELOG.md, followed by GitHub's list of
# merged pull requests and a link to the full diff against the previous release.
# Installed copies update from releases/latest/download/deckdrop.py.

on:
  push:
    branches: [main]
    paths: [src/**, tools/build.py, install.sh, CHANGELOG.md]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Read version
        id: ver
        run: |
          ver=$(python -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('src/deckdrop/__init__.py', encoding='utf-8').read()).group(1))")
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$ver" >/dev/null; then
            echo "v$ver already released, nothing to do"
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and check
        if: steps.ver.outputs.new == 'true'
        run: |
          python tools/changelog.py --check
          python -m pip install pyflakes
          python -m pyflakes src tools tests
          python tools/build.py
          DECKDROP_SKIP_USER_DATA=1 python -m unittest discover -s tests
          python tests/smoke.py dist/deckdrop.py
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          python tests/ui_check.py dist/deckdrop.py

      - name: User data survives an update (required)
        if: steps.ver.outputs.new == 'true'
        run: python -m unittest -v tests/test_user_data.py

      - name: Publish release
        if: steps.ver.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.ver.outputs.version }}
        run: |
          python tools/changelog.py "$VER" > notes.md
          gh release create "v$VER" dist/deckdrop.py install.sh \
            --target "$GITHUB_SHA" \
            --title "DeckDrop $VER" \
            --notes-file notes.md \
            --generate-notes
